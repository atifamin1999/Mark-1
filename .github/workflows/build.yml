          package com.stark.jarvis;
          import android.content.Context;
          import android.media.AudioManager;
          import android.view.KeyEvent;

          public class MediaController {
              private final AudioManager am;
              public MediaController(Context context) {
                  this.am = (AudioManager) context.getSystemService(Context.AUDIO_SERVICE);
              }
              public void playPause() { dispatch(KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE); }
              public void next() { dispatch(KeyEvent.KEYCODE_MEDIA_NEXT); }
              public void volumeUp() { am.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_RAISE, AudioManager.FLAG_SHOW_UI); }
              public void volumeDown() { am.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_LOWER, AudioManager.FLAG_SHOW_UI); }
              private void dispatch(int code) {
                  am.dispatchMediaKeyEvent(new KeyEvent(KeyEvent.ACTION_DOWN, code));
                  am.dispatchMediaKeyEvent(new KeyEvent(KeyEvent.ACTION_UP, code));
              }
          }
