          cat << 'EOF' > app/src/main/java/com/stark/jarvis/SmsHelper.java
          package com.stark.jarvis;
          import android.content.Context;
          import android.database.Cursor;
          import android.net.Uri;
          import android.provider.ContactsContract;
          import android.telephony.SmsManager;

          public class SmsHelper {
              private final Context context;
              public SmsHelper(Context context) { this.context = context; }
              public boolean sendSms(String recipient, String message) {
                  String number = recipient.replaceAll("[^0-9+]", "");
                  if (number.isEmpty()) number = getNumberFromName(recipient);
                  if (number == null || number.isEmpty()) return false;
                  try {
                      SmsManager smsManager = SmsManager.getDefault();
                      smsManager.sendTextMessage(number, null, message, null, null);
                      return true;
                  } catch (Exception e) {
                      return false;
                  }
              }
              private String getNumberFromName(String name) {
                  Uri uri = ContactsContract.CommonDataKinds.Phone.CONTENT_URI;
                  String[] projection = {ContactsContract.CommonDataKinds.Phone.NUMBER};
                  String selection = ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME + " LIKE ?";
                  String[] args = new String[]{"%" + name + "%"};
                  try (Cursor cursor = context.getContentResolver().query(uri, projection, selection, args, null)) {
                      if (cursor != null && cursor.moveToFirst()) return cursor.getString(0);
                  } catch (Exception ignored) {}
                  return null;
              }
          }
