          cat << 'EOF' > app/src/main/java/com/stark/jarvis/IncomingCallReceiver.java
          package com.stark.jarvis;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.database.Cursor;
          import android.net.Uri;
          import android.provider.ContactsContract;
          import android.speech.tts.TextToSpeech;
          import android.telephony.TelephonyManager;
          import java.util.Locale;

          public class IncomingCallReceiver extends BroadcastReceiver {
              private static TextToSpeech tts;
              @Override
              public void onReceive(Context context, Intent intent) {
                  SharedPreferences prefs = context.getSharedPreferences("JarvisPrefs", Context.MODE_PRIVATE);
                  if (prefs.getBoolean("is_system_disabled", false)) return;
                  if (!TelephonyManager.ACTION_PHONE_STATE_CHANGED.equals(intent.getAction())) return;
                  String state = intent.getStringExtra(TelephonyManager.EXTRA_STATE);
                  if (TelephonyManager.EXTRA_STATE_RINGING.equals(state)) {
                      String number = intent.getStringExtra(TelephonyManager.EXTRA_INCOMING_NUMBER);
                      String name = resolveName(context, number);
                      String announcement = (name != null) ? "Incoming call from " + name : "Incoming call from unknown number.";
                      if (tts == null) {
                          tts = new TextToSpeech(context.getApplicationContext(), s -> {
                              if (s == TextToSpeech.SUCCESS) {
                                  tts.setLanguage(Locale.US);
                                  tts.speak(announcement, TextToSpeech.QUEUE_FLUSH, null, "RING");
                              }
                          });
                      } else {
                          tts.speak(announcement, TextToSpeech.QUEUE_FLUSH, null, "RING");
                      }
                  } else if (TelephonyManager.EXTRA_STATE_IDLE.equals(state) && tts != null) {
                      tts.stop();
                  }
              }
              private String resolveName(Context ctx, String number) {
                  if (number == null) return null;
                  Uri uri = Uri.withAppendedPath(ContactsContract.PhoneLookup.CONTENT_FILTER_URI, Uri.encode(number));
                  try (Cursor cursor = ctx.getContentResolver().query(uri, new String[]{ContactsContract.PhoneLookup.DISPLAY_NAME}, null, null, null)) {
                      if (cursor != null && cursor.moveToFirst()) return cursor.getString(0);
                  } catch (Exception ignored) {}
                  return null;
              }
          }
