          cat << 'EOF' > app/src/main/java/com/stark/jarvis/NotesManager.java
          package com.stark.jarvis;
          import android.content.Context;
          import java.io.BufferedReader;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.InputStreamReader;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;

          public class NotesManager {
              private static final String FILE_NAME = "jarvis_vault.txt";
              private final Context context;
              public NotesManager(Context context) { this.context = context; }
              public boolean saveNote(String note) {
                  if (note == null || note.trim().isEmpty()) return false;
                  String time = new SimpleDateFormat("dd MMM, hh:mm a", Locale.getDefault()).format(new Date());
                  String entry = "[" + time + "] " + note.trim() + "\n";
                  try (FileOutputStream fos = context.openFileOutput(FILE_NAME, Context.MODE_APPEND)) {
                      fos.write(entry.getBytes());
                      return true;
                  } catch (Exception e) {
                      return false;
                  }
              }
              public String readNotes() {
                  File file = new File(context.getFilesDir(), FILE_NAME);
                  if (!file.exists()) return null;
                  StringBuilder sb = new StringBuilder();
                  try (FileInputStream fis = context.openFileInput(FILE_NAME);
                       BufferedReader reader = new BufferedReader(new InputStreamReader(fis))) {
                      String line;
                      while ((line = reader.readLine()) != null) sb.append(line).append(". ");
                      return sb.toString().trim();
                  } catch (Exception e) {
                      return null;
                  }
              }
              public boolean clearNotes() {
                  File file = new File(context.getFilesDir(), FILE_NAME);
                  return file.delete();
              }
          }
