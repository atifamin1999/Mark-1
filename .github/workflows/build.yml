          cat << 'EOF' > app/src/main/java/com/stark/jarvis/JarvisNotificationService.java
          package com.stark.jarvis;
          import android.app.Notification;
          import android.app.PendingIntent;
          import android.app.RemoteInput;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.ApplicationInfo;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.service.notification.NotificationListenerService;
          import android.service.notification.StatusBarNotification;
          import android.speech.tts.TextToSpeech;
          import java.util.Locale;

          public class JarvisNotificationService extends NotificationListenerService {
              private static TextToSpeech tts;
              public static Notification.Action activeReplyAction = null;
              public static RemoteInput activeRemoteInput = null;

              @Override
              public void onCreate() {
                  super.onCreate();
                  tts = new TextToSpeech(getApplicationContext(), status -> {
                      if (status == TextToSpeech.SUCCESS) {
                          tts.setLanguage(new Locale("hi", "IN"));
                          tts.setPitch(0.9f);
                      }
                  });
              }

              @Override
              public void onNotificationPosted(StatusBarNotification sbn) {
                  SharedPreferences prefs = getSharedPreferences("JarvisPrefs", Context.MODE_PRIVATE);
                  boolean isDisabled = prefs.getBoolean("is_system_disabled", false);
                  if (isDisabled) return;
                  if (sbn.getPackageName().equals(getPackageName())) return;
                  if ((sbn.getNotification().flags & Notification.FLAG_ONGOING_EVENT) != 0) return;

                  Bundle extras = sbn.getNotification().extras;
                  if (extras == null) return;
                  String title = extras.getString(Notification.EXTRA_TITLE, "");
                  CharSequence textSeq = extras.getCharSequence(Notification.EXTRA_TEXT);
                  String message = (textSeq != null) ? textSeq.toString() : "";
                  if (title.isEmpty() || message.isEmpty()) return;

                  Notification.Action[] actions = sbn.getNotification().actions;
                  if (actions != null) {
                      for (Notification.Action action : actions) {
                          if (action.getRemoteInputs() != null) {
                              for (RemoteInput input : action.getRemoteInputs()) {
                                  activeReplyAction = action;
                                  activeRemoteInput = input;
                                  break;
                              }
                          }
                      }
                  }

                  String appName = "Application";
                  try {
                      PackageManager pm = getPackageManager();
                      ApplicationInfo info = pm.getApplicationInfo(sbn.getPackageName(), 0);
                      appName = pm.getApplicationLabel(info).toString();
                  } catch (Exception ignored) {}

                  String announcement = appName + " par " + title + " ka message hai: " + message;
                  if (tts != null) tts.speak(announcement, TextToSpeech.QUEUE_ADD, null, "NOTIF");
              }

              public static boolean sendQuickReply(Context context, String replyText) {
                  if (activeReplyAction == null || activeRemoteInput == null) return false;
                  Intent intent = new Intent();
                  Bundle bundle = new Bundle();
                  bundle.putCharSequence(activeRemoteInput.getResultKey(), replyText);
                  RemoteInput.addResultsToIntent(new RemoteInput[]{activeRemoteInput}, intent, bundle);
                  try {
                      activeReplyAction.actionIntent.send(context, 0, intent);
                      activeReplyAction = null;
                      activeRemoteInput = null;
                      return true;
                  } catch (PendingIntent.CanceledException e) {
                      return false;
                  }
              }

              @Override
              public void onDestroy() {
                  if (tts != null) { tts.stop(); tts.shutdown(); }
                  super.onDestroy();
              }
          }
