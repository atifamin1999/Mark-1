          cat << 'EOF' > app/src/main/java/com/stark/jarvis/SecurityGateActivity.java
          package com.stark.jarvis;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Bundle;
          import android.speech.RecognitionListener;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          import android.speech.tts.TextToSpeech;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.TextView;
          import android.widget.Toast;
          import androidx.annotation.NonNull;
          import androidx.appcompat.app.AlertDialog;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.biometric.BiometricPrompt;
          import androidx.core.content.ContextCompat;
          import java.util.ArrayList;
          import java.util.Locale;

          public class SecurityGateActivity extends AppCompatActivity {
              private TextToSpeech tts;
              private SpeechRecognizer recognizer;
              private TextView tvStatus, tvAttempts;
              private int failedAttempts = 0;
              private SharedPreferences prefs;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_security_gate);
                  prefs = getSharedPreferences("JarvisPrefs", Context.MODE_PRIVATE);
                  tvStatus = findViewById(R.id.tvGateStatus);
                  tvAttempts = findViewById(R.id.tvAttempts);

                  Button btnVoice = findViewById(R.id.btnVoiceAuth);
                  Button btnBiometric = findViewById(R.id.btnBiometricAuth);
                  Button btnPin = findViewById(R.id.btnPinAuth);

                  initTTS();
                  initSpeechRecognizer();

                  btnVoice.setOnClickListener(v -> listenVoice());
                  btnBiometric.setOnClickListener(v -> launchBiometrics());
                  btnPin.setOnClickListener(v -> promptPinDialog());
              }

              private void initTTS() {
                  tts = new TextToSpeech(this, status -> {
                      if (status == TextToSpeech.SUCCESS) {
                          tts.setLanguage(Locale.US);
                          speak("Security clearance active. Verify voice print or biometrics.");
                      }
                  });
              }

              private void initSpeechRecognizer() {
                  recognizer = SpeechRecognizer.createSpeechRecognizer(this);
                  recognizer.setRecognitionListener(new RecognitionListener() {
                      @Override
                      public void onResults(Bundle results) {
                          ArrayList<String> matches = results.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                          if (matches != null && !matches.isEmpty()) {
                              String spoken = matches.get(0).toLowerCase();
                              String registeredTrigger = prefs.getString("voice_trigger", "jarvis");
                              if (spoken.contains(registeredTrigger)) {
                                  grantAccess();
                              } else {
                                  handleFailure();
                              }
                          }
                      }
                      @Override public void onReadyForSpeech(Bundle params) { tvStatus.setText("LISTENING..."); }
                      @Override public void onError(int error) { handleFailure(); }
                      @Override public void onBeginningOfSpeech() {}
                      @Override public void onRmsChanged(float rmsdB) {}
                      @Override public void onBufferReceived(byte[] buffer) {}
                      @Override public void onEndOfSpeech() {}
                      @Override public void onPartialResults(Bundle partialResults) {}
                      @Override public void onEvent(int eventType, Bundle params) {}
                  });
              }

              private void listenVoice() {
                  if (failedAttempts >= 3) {
                      promptPinDialog();
                      return;
                  }
                  Intent intent = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                  intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                  intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE, Locale.getDefault());
                  recognizer.startListening(intent);
              }

              private void handleFailure() {
                  failedAttempts++;
                  int left = 3 - failedAttempts;
                  tvAttempts.setText("Voice attempts remaining: " + Math.max(0, left));
                  if (failedAttempts >= 3) {
                      speak("Three failed attempts detected. PIN entry required.");
                      promptPinDialog();
                  } else {
                      speak("Voice signature mismatch. Try again.");
                  }
              }

              private void launchBiometrics() {
                  BiometricPrompt prompt = new BiometricPrompt(this,
                          ContextCompat.getMainExecutor(this), new BiometricPrompt.AuthenticationCallback() {
                      @Override
                      public void onAuthenticationSucceeded(@NonNull BiometricPrompt.AuthenticationResult result) {
                          grantAccess();
                      }
                      @Override
                      public void onAuthenticationFailed() {
                          speak("Biometric verification failed.");
                      }
                  });

                  BiometricPrompt.PromptInfo info = new BiometricPrompt.PromptInfo.Builder()
                          .setTitle("Mark 1 Biometric Clearance")
                          .setSubtitle("Authenticate Face or Fingerprint")
                          .setNegativeButtonText("Use PIN")
                          .build();

                  prompt.authenticate(info);
              }

              private void promptPinDialog() {
                  EditText input = new EditText(this);
                  input.setInputType(android.text.InputType.TYPE_CLASS_NUMBER | android.text.InputType.TYPE_NUMBER_VARIATION_PASSWORD);

                  new AlertDialog.Builder(this)
                          .setTitle("Security Override")
                          .setMessage("Enter 4-Digit Security PIN:")
                          .setView(input)
                          .setPositiveButton("VERIFY", (d, w) -> {
                              String entered = input.getText().toString().trim();
                              String savedPin = prefs.getString("security_pin", "3000");
                              if (entered.equals(savedPin)) {
