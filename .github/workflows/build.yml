          cat << 'EOF' > app/src/main/java/com/stark/jarvis/MainActivity.java
          package com.stark.jarvis;
          import android.Manifest;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.speech.RecognitionListener;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          import android.speech.tts.TextToSpeech;
          import android.speech.tts.UtteranceProgressListener;
          import android.telecom.TelecomManager;
          import android.widget.Button;
          import android.widget.ImageView;
          import android.widget.TextView;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;
          import java.util.ArrayList;
          import java.util.Locale;

          public class MainActivity extends AppCompatActivity {
              private TextToSpeech tts;
              private SpeechRecognizer recognizer;
              private TextView tvStatus, tvSubtitle;
              private AppLauncher appLauncher;
              private MediaController mediaController;
              private SmsHelper smsHelper;
              private NotesManager notesManager;
              private SharedPreferences prefs;
              private String userName;
              private String voiceTrigger;
              private boolean isSystemDisabled = false;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  prefs = getSharedPreferences("JarvisPrefs", Context.MODE_PRIVATE);
                  userName = prefs.getString("user_name", "Sir");
                  voiceTrigger = prefs.getString("voice_trigger", "jarvis");
                  isSystemDisabled = prefs.getBoolean("is_system_disabled", false);

                  tvStatus = findViewById(R.id.tvMainStatus);
                  tvSubtitle = findViewById(R.id.tvSubtitle);
                  ImageView ivReactor = findViewById(R.id.ivArcReactorBtn);
                  Button btnSettings = findViewById(R.id.btnOpenSettings);

                  appLauncher = new AppLauncher(this);
                  mediaController = new MediaController(this);
                  smsHelper = new SmsHelper(this);
                  notesManager = new NotesManager(this);

                  updateUIStatus();
                  btnSettings.setOnClickListener(v -> startActivity(new Intent(this, SettingsActivity.class)));
                  ivReactor.setOnClickListener(v -> listen());

                  requestPermissions();
                  initTTS();
                  initSpeechRecognizer();
              }

              private void updateUIStatus() {
                  if (isSystemDisabled) {
                      tvStatus.setText("MARK 1 // STAND-DOWN");
                      tvSubtitle.setText("Systems in hibernation. Say '" + voiceTrigger + " activate' to wake.");
                  } else {
                      tvStatus.setText("MARK 1 // ONLINE");
                      tvSubtitle.setText("Systems awaiting orders, " + userName + ".");
                  }
              }

              private void requestPermissions() {
                  String[] perms = {
                          Manifest.permission.RECORD_AUDIO,
                          Manifest.permission.READ_PHONE_STATE,
                          Manifest.permission.READ_CALL_LOG,
                          Manifest.permission.READ_CONTACTS,
                          Manifest.permission.ANSWER_PHONE_CALLS,
                          Manifest.permission.SEND_SMS
                  };
                  ActivityCompat.requestPermissions(this, perms, 100);
              }

              private void initTTS() {
                  tts = new TextToSpeech(this, status -> {
                      if (status == TextToSpeech.SUCCESS) {
                          tts.setLanguage(new Locale("hi", "IN"));
                          tts.setPitch(0.9f);
                          tts.setOnUtteranceProgressListener(new UtteranceProgressListener() {
                              @Override public void onStart(String utteranceId) {}
                              @Override public void onError(String utteranceId) {}
                              @Override
                              public void onDone(String utteranceId) {
                                  if ("WAIT_LOOP".equals(utteranceId) && !isSystemDisabled) {
                                      runOnUiThread(() -> listen());
                                  }
                              }
                          });
                          if (!isSystemDisabled) speak("Mark 1 online hai " + userName + ". Aadesh kijiye.", false);
                      }
                  });
              }

              private void initSpeechRecognizer() {
                  recognizer = SpeechRecognizer.createSpeechRecognizer(this);
                  recognizer.setRecognitionListener(new RecognitionListener() {
                      @Override
                      public void onResults(Bundle results) {
                          ArrayList<String> matches = results.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                          if (matches != null && !matches.isEmpty()) executeCommand(matches.get(0).toLowerCase());
                      }
                      @Override public void onReadyForSpeech(Bundle params) { tvStatus.setText("LISTENING..."); }
                      @Override public void onError(int error) { updateUIStatus(); }
                      @Override public void onBeginningOfSpeech() {}
                      @Override public void onRmsChanged(float rmsdB) {}
                      @Override public void onBufferReceived(byte[] buffer) {}
                      @Override public void onEndOfSpeech() { tvStatus.setText("PROCESSING..."); }
                      @Override public void onPartialResults(Bundle partialResults) {}
                      @Override public void onEvent(int eventType, Bundle params) {}
                  });
              }

              private void executeCommand(String cmd) {
                  tvSubtitle.setText("Command: " + cmd);

                  // 1. OWNER & PATENT QUERY
                  if (cmd.contains("owner") || cmd.contains("creator") || cmd.contains("banaya") || cmd.contains("who made you")) {
                      speak("Mera naam Mark 1 Jarvis hai. Mere creator, owner aur system architect Amin Ansari hain, aur iska patent unhi ke naam par hai.", true);
                      return;
                  }

                  // 2. WAKE UP PROTOCOL
                  if (isSystemDisabled) {
                      if (cmd.contains("activate") || cmd.contains("wake up") || cmd.contains("on ho jao") || cmd.contains("chalu ho")) {
                          isSystemDisabled = false;
                          prefs.edit().putBoolean("is_system_disabled", false).apply();
                          updateUIStatus();
                          speak("Mark 1 reactivated. All systems online, " + userName + ".", true);
                      }
                      return;
                  }

                  // 3. DISABLE / STAND-DOWN
                  if (cmd.contains("disable ho jao") || cmd.contains("stand down") || cmd.contains("sleep mode") || cmd.contains("so jao") || cmd.contains("shutdown")) {
                      isSystemDisabled = true;
                      prefs.edit().putBoolean("is_system_disabled", true).apply();
                      updateUIStatus();
                      speak("Standing down, " + userName + ". Mark 1 entering hibernation mode. Aawaz dijiye jab zaroorat ho.", false);
                      return;
                  }

                  // 4. SETTINGS
                  if (cmd.contains("settings") || cmd.contains("reset profile")) {
                      speak("Settings open kar raha hoon " + userName, false);
                      startActivity(new Intent(this, SettingsActivity.class));
                      return;
                  }

                  // 5. CALL CONTROLS
                  if (cmd.contains("receive") || cmd.contains("uthao") || cmd.contains("pick")) {
                      handleCallAction(true);
                      return;
                  }
                  if (cmd.contains("cut") || cmd.contains("reject") || cmd.contains("disconnect")) {
                      handleCallAction(false);
                      return;
                  }

                  // 6. MEDIA CONTROLS
                  if (cmd.contains("play") || cmd.contains("pause") || cmd.contains("gana")) {
                      mediaController.playPause();
                      speak("Media state updated " + userName + ". Aage kya karna hai?", true);
                      return;
                  }
                  if (cmd.contains("next")) {
                      mediaController.next();
                      speak("Playing next track, " + userName + ".", true);
                      return;
                  }
                  if (cmd.contains("volume up") || cmd.contains("awaaj badhao")) {
                      mediaController.volumeUp();
                      speak("Volume badha di gayi hai. Aage batayein?", true);
                      return;
                  }
                  if (cmd.contains("volume down") || cmd.contains("awaaj kam karo")) {
                      mediaController.volumeDown();
                      speak("Volume kam kar di gayi hai.", true);
                      return;
                  }

                  // 7. NOTIFICATION QUICK REPLY
                  if (cmd.startsWith("reply") || cmd.startsWith("jawab do")) {
                      String replyText = cmd.replace("reply", "").replace("jawab do", "").trim();
                      boolean sent = JarvisNotificationService.sendQuickReply(this, replyText);
                      speak(sent ? "Reply bhej diya gaya hai, " + userName + "." : "Active message nahi mila reply ke liye.", true);
                      return;
                  }

                  // 8. DIRECT SMS
                  if (cmd.contains("message bhejo") || cmd.contains("sms karo")) {
                      String clean = cmd.replace("message bhejo", "").replace("sms karo", "").trim();
                      String[] parts = clean.split(" ko ");
                      if (parts.length == 2) {
                          boolean sent = smsHelper.sendSms(parts[0].trim(), parts[1].trim());
                          speak(sent ? parts[0] + " ko message send ho gaya hai." : "Contact number nahi mila sir.", true);
                      }
                      return;
                  }

                  // 9. VOICE NOTES
                  if (cmd.contains("note likho") || cmd.contains("save note")) {
                      String note = cmd.replace("note likho", "").replace("save note", "").replace(voiceTrigger, "").trim();
                      notesManager.saveNote(note);
                      speak("Note record ho gaya: " + note + ". Aage batayein " + userName + "?", true);
                      return;
                  }
                  if (cmd.contains("note sunao") || cmd.contains("read notes")) {
                      String notes = notesManager.readNotes();
                      speak(notes != null ? "Saved notes: " + notes : "Vault empty hai sir.", true);
                      return;
                  }

                  // 10. APP LAUNCHER
                  if (cmd.contains("open") || cmd.contains("kholo")) {
                      String app = cmd.replace("open", "").replace("kholo", "").replace(voiceTrigger, "").trim();
                      boolean launched = appLauncher.openAppByName(app);
                      speak(launched ? "Ji " + userName + ", " + app + " open kar diya hai. Aage batayein?" : "App nahi mili sir.", true);
                      return;
                  }

                  speak("Order registered, " + userName + ". Aage kya aadesh hai?", true);
              }

              private void handleCallAction(boolean accept) {
                  TelecomManager tm = (TelecomManager) getSystemService(Context.TELECOM_SERVICE);
                  if (tm != null && ActivityCompat.checkSelfPermission(this, Manifest.permission.ANSWER_PHONE_CALLS) == PackageManager.PERMISSION_GRANTED) {
                      if (accept && Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          tm.acceptRingingCall();
                          speak("Call accept ho gayi hai, " + userName + ".", false);
                      } else if (!accept && Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                          tm.endCall();
                          speak("Call disconnect kar di gayi hai.", false);
                      }
                  }
              }

              private void listen() {
                  Intent intent = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                  intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                  intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE, Locale.getDefault());
                  recognizer.startListening(intent);
              }

              private void speak(String text, boolean loop) {
                  if (tts != null) {
                      tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, loop ? "WAIT_LOOP" : "NORMAL");
                  }
              }

              @Override
              protected void onDestroy() {
                  if (tts != null) { tts.stop(); tts.shutdown(); }
                  if (recognizer != null) { recognizer.destroy(); }
                  super.onDestroy();
              }
          }
          EOF

      - name: Setup Java JDK 17
