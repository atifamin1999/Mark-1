          cat << 'EOF' > app/src/main/java/com/stark/jarvis/SplashActivity.java
          package com.stark.jarvis;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import androidx.appcompat.app.AppCompatActivity;

          public class SplashActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_splash);
                  new Handler(Looper.getMainLooper()).postDelayed(() -> {
                      SharedPreferences prefs = getSharedPreferences("JarvisPrefs", Context.MODE_PRIVATE);
                      boolean isConfigured = prefs.getBoolean("is_setup_done", false);
                      if (!isConfigured) {
                          startActivity(new Intent(SplashActivity.this, SetupWizardActivity.class));
                      } else {
                          startActivity(new Intent(SplashActivity.this, SecurityGateActivity.class));
                      }
                      finish();
                  }, 2000);
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/stark/jarvis/SetupWizardActivity.java
          package com.stark.jarvis;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Bundle;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.Toast;
          import androidx.appcompat.app.AppCompatActivity;

          public class SetupWizardActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_setup_wizard);
                  EditText etName = findViewById(R.id.etUserName);
                  EditText etTrigger = findViewById(R.id.etVoiceTrigger);
                  EditText etPin = findViewById(R.id.etSecurityPin);
                  Button btnSave = findViewById(R.id.btnSaveProfile);

                  SharedPreferences prefs = getSharedPreferences("JarvisPrefs", Context.MODE_PRIVATE);
                  etName.setText(prefs.getString("user_name", "Sir"));
                  etTrigger.setText(prefs.getString("voice_trigger", "jarvis"));
                  etPin.setText(prefs.getString("security_pin", "3000"));

                  btnSave.setOnClickListener(v -> {
                      String name = etName.getText().toString().trim();
                      String trigger = etTrigger.getText().toString().trim().toLowerCase();
                      String pin = etPin.getText().toString().trim();
                      if (name.isEmpty() || trigger.isEmpty() || pin.length() < 4) {
                          Toast.makeText(this, "Complete all security fields, sir.", Toast.LENGTH_SHORT).show();
                          return;
                      }
                      prefs.edit()
                              .putBoolean("is_setup_done", true)
                              .putString("user_name", name)
                              .putString("voice_trigger", trigger)
                              .putString("security_pin", pin)
                              .apply();
                      Toast.makeText(this, "Protocol Initialized: " + name, Toast.LENGTH_SHORT).show();
                      startActivity(new Intent(SetupWizardActivity.this, MainActivity.class));
                      finish();
                  });
              }
          }
